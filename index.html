<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Chatbot na Nuvem</title>
    
    <!-- Biblioteca para traduzir Markdown (negrito, códigos, etc) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            background: white; 
            width: 450px; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .historico { 
            height: 350px; 
            overflow-y: auto; 
            background: #eef2f3; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 10px; 
        }
        
        .mensagem { margin-bottom: 15px; padding: 10px; border-radius: 5px; line-height: 1.5; }
        .user { background: #007bff; color: white; text-align: right; }
        .bot { background: #ddd; color: black; text-align: left; }
        
        /* Estilo para blocos de código dentro do Markdown */
        .bot code { background: #333; color: #fff; padding: 2px 5px; border-radius: 3px; font-family: monospace; }
        
        .input-group { display: flex; gap: 5px; margin-bottom: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-enviar { background: #28a745; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        
        .btn-limpar { background: #dc3545; width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .btn-ranking { background: #6f42c1; color: white; width: 100%; margin-top: 10px; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }

        /* Estilos do Modo Documento */
        .doc-container { 
            background: #fff3cd; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 10px; 
            border: 1px solid #ffeeba; 
        }
        .toggle-label { 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            color: #856404; 
        }
        #docUpload { 
            margin-top: 10px; 
            width: 100%; 
            display: none; /* Começa escondido */
        }

        /* Estilo para a Tabela de Ranking */
        .ranking-container {
            margin-top: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none; /* Começa escondido */
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>🤖 Assistente IA</h2>
        
        <!-- Campo de Nickname -->
        <div style="margin-bottom: 10px;">
            <input type="text" id="nickname" placeholder="Seu Nickname (Apelido)..." style="width: 95%;">
        </div>

        <!-- NOVO: Container de Upload de Documento (RAG) -->
        <div class="doc-container">
            <label class="toggle-label">
                <input type="checkbox" id="modoDocumento" onchange="alternarModoDocumento()">
                📄 Conversar com Documento (PDF)
            </label>
            <input type="file" id="docUpload" accept=".pdf, .txt">
        </div>

        <!-- Histórico do Chat -->
        <div class="historico" id="historico"></div>
        
        <!-- Input de Pergunta e Botão Enviar -->
        <div class="input-group">
            <input type="text" id="pergunta" placeholder="Digite sua pergunta...">
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
        </div>
        
        <!-- Botões Extras -->
        <button class="btn-limpar" onclick="limparChat()">🗑️ Limpar Conversa</button>
        <button class="btn-ranking" onclick="mostrarRanking()">🏆 Ver Ranking (Hall da Fama)</button>

        <!-- Tabela de Ranking (Oculta por padrão) -->
        <div id="ranking-box" class="ranking-container">
            <h3>🏆 Top 10 Guardiões</h3>
            <table>
                <thead>
                    <tr>
                        <th>Pos.</th>
                        <th>Nickname</th>
                        <th>XP</th>
                    </tr>
                </thead>
                <tbody id="tabela-ranking">
                    <!-- Os dados entrarão aqui via JS -->
                </tbody>
            </table>
            <button onclick="document.getElementById('ranking-box').style.display='none'" style="margin-top:10px; cursor:pointer;">Fechar</button>
        </div>
    </div>

    <script>
    // URL do seu Back-end. Se estiver testando localmente, mude para http://localhost:3000/api/chat
    const URL_BA    SE = "https://api-agente-ia-6.onrender.com/api/chat";

    // ATENÇÃO: Como seu backend agora exige um token (autenticarToken), 
    // futuramente você precisará substituir essa variável pelo token real gerado no login.
    const TOKEN_USUARIO = "SEU_TOKEN_AQUI"; 

    /**
     * Mostra ou esconde o input de arquivo dependendo se a caixa está marcada
     */
    function alternarModoDocumento() {
        const checkbox = document.getElementById("modoDocumento");
        const inputFile = document.getElementById("docUpload");
        inputFile.style.display = checkbox.checked ? "block" : "none";
    }

    /**
     * FUNÇÃO: ENVIAR MENSAGEM (Trata chat normal e upload de PDF)
     */
function enviarMensagem() {
    const input = document.getElementById("pergunta");
    const nickInput = document.getElementById("nickname");
    
    const texto = input.value.trim();
    const nickname = nickInput.value.trim();

    // Validações básicas
    if (!nickname) {
        alert("⚠️ Digite um Nickname!");
        return;
    }
    if (!texto) return;

    // Emite o evento para o servidor
    socket.emit('novaMensagem', {
        nickname: nickname,
        texto: texto
    });

    // Limpa o input
    input.value = "";
}

function enviarMensagemViaSocket() {
        const input = document.getElementById("pergunta");
    const nick = document.getElementById("nickname").value;
        if (input.value.trim() !== "") {
        // Emite para o servidor
        socket.emit('novaMensagem', { 
               nickname: nick, 
            texto: input.value 
        });
        input.value = "";
    }
}

socket.on('mensagemRecebida', (dados) => {
    const historico = document.getElementById("historico");
        historico.innerHTML += `
        <div class="mensagem ${dados.ehBot ? 'bot' : 'user'}">
            <strong>${dados.nickname}:</strong> ${dados.texto}
                  </div>`;
    historico.scrollTop = historico.scrollHeight;
});

    /**
     * FUNÇÃO: MOSTRAR RANKING
     */
    async function mostrarRanking() {
        const box = document.getElementById("ranking-box");
        const tabela = document.getElementById("tabela-ranking");
        
        try {
            const resposta = await fetch(`${URL_BASE}/ranking`);
            const jogadores = await resposta.json();
            
            tabela.innerHTML = ""; 
            
            jogadores.forEach((jogador, index) => {
                let posicao;
                if(index === 0) posicao = "🥇";
                else if(index === 1) posicao = "🥈";
                else if(index === 2) posicao = "🥉";
                else posicao = `${index + 1}º`;

                tabela.innerHTML += `
                    <tr>
                        <td>${posicao}</td>
                        <td>${jogador.nome}</td>
                        <td>${jogador.xp}</td>
                    </tr>
                `;
            });
            
            box.style.display = "block"; 
        } catch (erro) {
            console.error("Erro ao carregar ranking:", erro);
            alert("Não foi possível carregar o Hall da Fama.");
        }
    }

    /**
     * FUNÇÃO: LIMPAR CHAT
     */
    async function limparChat() {
        if (!confirm("Deseja apagar todo o histórico de mensagens?")) return;

        try {
            const resposta = await fetch(`${URL_BASE}/limpar`, { method: "DELETE" });
            if (resposta.ok) {
                document.getElementById("historico").innerHTML = ""; 
                alert("Chat reiniciado!");
            }
        } catch (erro) {
            alert("Falha ao limpar histórico.");
        }
    }

    // Permite enviar a mensagem apertando a tecla ENTER
    document.getElementById("pergunta").addEventListener("keypress", function(e) {
        if (e.key === "Enter") enviarMensagem();
    });

const meuToken = localStorage.getItem('token_saas');

const socket = io("https://api-agente-ia-6.onrender.com", {
    auth: {
        token: meuToken
    }
});

// Gerenciamento de erro de conexão (caso o token seja recusado)
socket.on("connect_error", (err) => {
    console.error("Erro de conexão:", err.message);
    if (err.message.includes("Autenticação")) {
        alert("Sua sessão expirou ou você não está logado!");
        // window.location.href = "/login.html"; // Opcional: redirecionar
    }
});



// Verifica se conectou
socket.on('connect', () => {
    console.log("Conectado ao servidor! ID:", socket.id);
});

// 2. Escutando mensagens que chegam do servidor (mensagemRecebida)
socket.on('mensagemRecebida', (dados) => {
    const historico = document.getElementById("historico");
    
    // Formata a mensagem na tela
    // Adicionamos uma classe extra se for o BOT para o CSS funcionar
    const classe = dados.nickname === "Guardião" ? "bot" : "user";
    
    historico.innerHTML += `
        <div class="mensagem ${classe}">
            <strong>${dados.nickname}:</strong> ${dados.texto}
        </div>`;
    
    // Rola o scroll para baixo automaticamente
    historico.scrollTop = historico.scrollHeight;
});
    </script>


    


</body>
</html>
